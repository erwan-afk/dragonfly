name: Send Renewal Reminders

# Calls the production app's own endpoint, so the job always runs on the
# production database (the previous version connected with a DATABASE_URL
# secret that did not point to it, so reminders never reached real users).
#
# Needs the repository secret CRON_SECRET_TOKEN (same value as the
# CRON_SECRET_TOKEN environment variable of the deployed app).
#
# Preview without sending: POST the same URL with "?dryRun=1" appended; the
# response lists what would be sent (masked recipients) and nothing is sent or
# modified.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Send renewal reminders
        env:
          CRON_SECRET_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET_TOKEN}" ]; then
            echo "::error::Repository secret CRON_SECRET_TOKEN is not set"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET_TOKEN}" \
            "https://3hulls.com/api/send-renewal-reminders" | tee response.json
          echo
